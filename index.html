<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Generate a temporary Alice from the Combinatorial Alice component archive.">
  <meta name="theme-color" content="#fffaf0">
  <title>Random Alice Generator — Combinatorial Alice</title>
  <link rel="stylesheet" href="style.css?v=generator-casing-v5">
</head>
<body>
  <main class="app-shell">
    <header class="site-header">
      <div class="identity">
        <img class="gear-cluster gear-cluster-left" src="alice_gears.svg" alt="" aria-hidden="true">
        <p class="project-mark">A Combinatorial Alice project</p>
        <p class="eyebrow">Random Alice Generator</p>
        <div class="counter-bank">
          <p class="possibilities"><strong id="count">—</strong> <span>possible Alices</span></p>
        </div>
      </div>
      <nav class="actions" aria-label="Alice controls">
        <img class="gear-cluster gear-cluster-right" src="alice_gears.svg" alt="" aria-hidden="true">
        <button class="button button-primary lever-control" id="randomise" type="button"><span class="lever-knob" aria-hidden="true"></span><span>Generate Alice</span></button>
        <button class="button inspect-control" id="view-alice" type="button"><span aria-hidden="true">⌕</span><span>Supersize Her</span></button>
        <button class="icon-button" id="about-button" type="button" aria-label="Operating instructions"><span aria-hidden="true">i</span><span class="control-label">Operating instructions</span></button>
      </nav>
    </header>

    <section class="stage" aria-label="Assemble Alice">
      <div class="alice" id="alice" aria-label="A combinatorial Alice"></div>
      <p class="instruction">Turn a row, lock a component, or pull the lever to generate.</p>
    </section>
  </main>

  <dialog class="viewer" id="viewer">
    <div class="dialog-bar">
      <div><p class="dialog-kicker">Generated output</p><h2>Current Alice</h2></div>
      <button class="close-button" type="button" data-close="viewer" aria-label="Close current Alice">×</button>
    </div>
    <div class="viewer-scroll">
      <p class="biographical-summary" id="biographical-summary" hidden></p>
      <div class="assembled" id="assembled"></div>
    </div>
    <div class="dialog-actions">
      <button class="button button-primary" id="save-alice" type="button">Save Alice</button>
      <button class="button" id="copy-link" type="button">Copy link</button>
      <button class="button" id="share-alice" type="button">Share</button>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>
  </dialog>

  <dialog class="about" id="about">
    <div class="dialog-bar"><h2>About Combinatorial Alice</h2><button class="close-button" type="button" data-close="about" aria-label="Close about panel">×</button></div>
    <div class="about-copy" id="about-copy"><p>Loading…</p></div>
  </dialog>

  <script src="app.js?v=lever-gesture-v1"></script>
</body>
</html>
