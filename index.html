<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A modular identity artefact. Assemble a temporary Alice.">
  <title>Combinatorial Alice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">An exploratory identity artefact</p><h1>Combinatorial Alice</h1></div>
      <button class="randomise" type="button">Random Alice</button>
    </header>
    <div class="stage">
      <div class="alice" aria-label="A combinatorial Alice"></div>
      <p class="instruction">Swipe a block or use its arrows.</p>
    </div>
    <footer><p>There is no definitive Alice.</p><p class="count"></p></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
